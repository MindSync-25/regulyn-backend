spring:
  application:
    name: children-guardian-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

audit:
  schema: children

children:
  esign:
    defaultProvider: STUB
    stub:
      hmacSecret: test-secret

evidence:
  service:
    baseUrl: http://localhost:8083
  reporting:
    baseUrl: http://localhost:8087

notification:
  service:
    baseUrl: http://localhost:8086

server:
  port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
