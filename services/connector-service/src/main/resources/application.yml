spring:
  application:
    name: connector-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: connector
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: connector

server:
  port: 8093

regulyn:
  jwt:
    secret: ${JWT_SECRET:default-secret-key-change-in-production}
  observability:
    otel:
      enabled: false
  evidence:
    baseUrl: ${EVIDENCE_SERVICE_URL:http://localhost:8083}

connector:
  credentials:
    encryption:
      key: ${CONNECTOR_ENCRYPTION_KEY:}
    aws:
      enabled: ${AWS_SECRETS_ENABLED:false}
      region: ${AWS_REGION:us-east-1}
      secrets-endpoint: ${AWS_SECRETS_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
  scheduler:
    batch-size: ${SCHEDULER_BATCH_SIZE:50}
  run-worker:
    batch-size: ${RUN_WORKER_BATCH_SIZE:50}
    stuck-timeout-minutes: ${RUN_WORKER_STUCK_TIMEOUT_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
