spring:
  application:
    name: connector-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: connector

server:
  port: 8093

regulyn:
  jwt:
    secret: ${JWT_SECRET:default-secret-key-change-in-production}
  observability:
    otel:
      enabled: false
  evidence:
    baseUrl: ${EVIDENCE_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
