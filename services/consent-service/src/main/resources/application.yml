spring:
  application:
    name: consent-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: consent
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: consent

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

