spring:
  application:
    name: dsar-grievance-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: dsar
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: dsar

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
