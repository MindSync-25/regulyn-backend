spring:
  application:
    name: dsar-grievance-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: dsar
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: dsar
  datasource:
    hikari:
      connection-init-sql: SET search_path TO dsar

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

evidence:
  service:
    url: http://localhost:8095

notification:
  service:
    url: http://localhost:8087

audit:
  schema: dsar

dsar:
  sla:
    scheduler:
      enabled: true
      cron: "0 */15 * * * *"  # Every 15 minutes
    escalation:
      enabled: true
      cron: "0 */15 * * * *"  # Every 15 minutes
      thresholds:
        warningDays: 60
        criticalDays: 80
        breachDays: 90
      recipients:
        emails: "dpo@example.com,admin@example.com"
      notification:
        templateKey: "DSAR_SLA_ESCALATION"
        fromName: "Regulyn"
        category: "LEGAL"
        language: "en"
