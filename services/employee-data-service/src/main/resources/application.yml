spring:
  application:
    name: employee-data-service
  datasource:
    url: jdbc:postgresql://localhost:5432/regulyn_db
    username: regulyn
    password: regulyn_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: employee
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: employee
    locations: classpath:db/migration

audit:
  schema: employee

employee:
  resumeRetention:
    cleanup:
      fixedDelay: PT5M
      batchSize: 100

# Evidence service integration
evidence:
  service:
    url: http://localhost:8083

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.regulyn.employee: DEBUG
    org.springframework.security: INFO
