spring:
  application:
    name: evidence-reporting-service
  datasource:
    hikari:
      connection-init-sql: SET search_path TO evidence
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: evidence
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: evidence
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8095

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

audit:
  schema: evidence

evidence:
  storage:
    localDir: ./data/evidence
  export:
    baseDir: ./data/evidence-exports
