spring:
  application:
    name: evidence-reporting-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: evidence
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: evidence
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8095

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

evidence:
  storage:
    localDir: ./data/evidence
