spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://regulyn-dev-db.cluster-xxxxx.ap-south-1.rds.amazonaws.com:5432/regulyn_dev}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true

# TODO: AWS Secrets Manager integration
# AWS Secrets Manager ARN: arn:aws:secretsmanager:ap-south-1:ACCOUNT:secret:regulyn/dev/db
# KMS Key ID: alias/regulyn-dev-key
