spring:
  application:
    name: identity-tenant-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# OpenTelemetry Configuration
otel:
  enabled: ${OTEL_ENABLED:false}

audit:
  schema: identity

invite:
  token:
    secret: ${INVITE_TOKEN_SECRET:change-me-in-production}
    encryption-key: ${INVITE_TOKEN_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

api:
  key:
    hmac-secret: ${API_KEY_HMAC_SECRET:change-me-in-production}
