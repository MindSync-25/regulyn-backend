spring:
  application:
    name: incident-breach-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/regulyn}
    username: ${DB_USERNAME:regulyn}
    password: ${DB_PASSWORD:regulyn_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO incident
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: incident
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: incident

audit:
  schema: incident

incident:
  round2:
    notices:
      bridgeEnabled: true
      makerCheckerEnabled: true
  close:
    requireEvidenceBundle: true
  notifications:
    authorityContacts: []
    boardContacts: []
    receiptWebhookSecret: ""
  sla-escalation:
    dpoEmails: []
    adminEmails: []

server:
  port: 8087

evidence:
  service:
    url: ${EVIDENCE_SERVICE_URL:http://localhost:8095}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
    stub: ${NOTIFICATION_SERVICE_STUB:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
