spring:
  application:
    name: nominee-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/regulyn}
    username: ${DATABASE_USERNAME:regulyn_user}
    password: ${DATABASE_PASSWORD:regulyn_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: nominee
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: nominee
    default-schema: nominee
    locations: classpath:db/migration

server:
  port: 8088

evidence:
  baseUrl: ${EVIDENCE_BASE_URL:http://localhost:8083}

audit:
  schema: nominee

nominee:
  documents:
    maxSizeBytes: ${NOMINEE_DOCUMENTS_MAX_SIZE_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
