spring:
  application:
    name: notification-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: notification
    locations: classpath:db/migration

server:
  port: 8092

audit:
  schema: notification

evidence:
  service:
    url: ${EVIDENCE_SERVICE_URL:http://localhost:8083}

consent:
  enabled: ${CONSENT_ENABLED:true}
  baseUrl: ${CONSENT_SERVICE_URL:http://localhost:8084}
  timeout: ${CONSENT_TIMEOUT:2s}

smtp:
  enabled: ${SMTP_ENABLED:false}
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  starttls: ${SMTP_STARTTLS:true}
  auth: ${SMTP_AUTH:true}
  from: ${SMTP_FROM:no-reply@regulyn.io}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
