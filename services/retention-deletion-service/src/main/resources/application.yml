spring:
  application:
    name: retention-deletion-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Evidence service integration and storage
evidence:
  service:
    url: http://localhost:8083
  storage:
    localDir: ./data/deletion-proofs

# Retention scheduler
retention:
  scheduler:
    enabled: true
    cron: "0 0 0 * * ?"  # Daily at midnight
