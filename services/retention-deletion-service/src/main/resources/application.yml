spring:
  application:
    name: retention-deletion-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:dd/migration

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

audit:
  schema: deletion

# Evidence service integration and storage
evidence:
  service:
    url: ${EVIDENCE_SERVICE_URL:http://localhost:8095}
  storage:
    localDir: ./data/deletion-proofs

# Retention scheduler
retention:
  scheduler:
    enabled: true
    cron: "0 0 0 * * ?"  # Daily at midnight

connector:
  service:
    url: ${CONNECTOR_SERVICE_URL:http://localhost:8093}

deletion:
  cascade:
    systems: []
