spring:
  application:
    name: vendor-sharing-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: vendor
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: vendor

server:
  port: 8090

audit:
  schema: vendor

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

evidence:
  service:
    url: http://localhost:8083
